#
# Tuning of libcamera's software ISP IPA ("simple") for the front camera, GalaxyCore GC2375H (fixed
# focus). Same as libcamera's uncalibrated.yaml plus more colour saturation.
%YAML 1.1
---
version: 1
algorithms:
  # The automatic estimate takes the darkest few percent of a 64 bin histogram: in a dim room (the
  # sensor at its maximum gain, where the noise spreads the dark pixels) it comes out as 12 of 255,
  # too low, and the digital gain of the auto exposure turns what is left into haze, green
  # highlights and magenta shadows. Measured on the test chart: shadows are neutral with 14 of 255
  # (16, the nominal 64 of 1023, already clips red and blue in the shadows). 16 bit scale.
  - BlackLevel:
      blackLevel: 3584
  - Awb:
  - Adjust:
      # No colour correction matrix (too slow on the CPU): the raw colours are pale.
      saturation: 1.6
  - Agc:
      # libcamera's default of 2.5 is an overexposed, pale picture once the digital gain can reach it.
      exposureTarget: 2.1
      # A front camera mostly sees a face in front of a window or a lamp: tolerate more clipping.
      rawClipLimit: 0.04
      clipLimit: 0.08
      maxDigitalGain: 4.0
  - Af:
...
